<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" opacity="0.4" />
    </pattern>

    <!-- Animated Radar Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes float-pill {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
      }
      @keyframes signal-wave {
        0% { stroke-dashoffset: 100; opacity: 0.2; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      .animated-bg-circle {
        animation: pulse 6s ease-in-out infinite;
        transform-origin: 950px 160px;
      }
      .radar-line {
        animation: radar-sweep 12s linear infinite;
        transform-origin: 980px 160px;
      }
      .pill-1 { animation: float-pill 4s ease-in-out infinite; }
      .pill-2 { animation: float-pill 5s ease-in-out infinite 1s; }
      .pill-3 { animation: float-pill 4.5s ease-in-out infinite 0.5s; }
      .wave-path {
        stroke-dasharray: 20;
        animation: signal-wave 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Cyber Grid Background -->
  <rect width="1200" height="320" rx="16" fill="url(#cyber-grid)" />

  <!-- Ambient Dynamic Lights (Background Layer) -->
  <circle class="animated-bg-circle" cx="950" cy="160" r="140" fill="#06B6D4" opacity="0.15" filter="url(#glow)" />
  <circle class="animated-bg-circle" cx="200" cy="80" r="100" fill="#8B5CF6" opacity="0.12" filter="url(#glow)" />

  <!-- Decorative Dynamic Background Elements (Right Side HUD Graphics) -->
  <g transform="translate(40, 0)">
    <!-- Radar Circle Visuals -->
    <circle cx="940" cy="160" r="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="940" cy="160" r="80" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.4" />
    <circle cx="940" cy="160" r="40" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6" />
    <circle cx="940" cy="160" r="6" fill="#38bdf8" filter="url(#glow)" />

    <!-- Sweeping Radar Line -->
    <line class="radar-line" x1="940" y1="160" x2="1050" y2="160" stroke="url(#primary-glow)" stroke-width="2" stroke-linecap="round" filter="url(#glow)" />

    <!-- Status Floating Pills (Background Visual Accents) -->
    <g class="pill-1" transform="translate(730, 60)">
      <rect width="130" height="32" rx="16" fill="url(#card-grad)" stroke="#06B6D4" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#10B981" />
      <text x="28" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">SIEM ACTIVE</text>
    </g>

    <g class="pill-2" transform="translate(790, 220)">
      <rect width="140" height="32" rx="16" fill="url(#card-grad)" stroke="#8B5CF6" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#3B82F6" />
      <text x="28" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">SOC TELEMETRY</text>
    </g>

    <g class="pill-3" transform="translate(670, 150)">
      <rect width="120" height="30" rx="15" fill="url(#card-grad)" stroke="#F59E0B" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#F59E0B" />
      <text x="26" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">THREAT INTEL</text>
    </g>
  </g>

  <!-- Left Accent Bar -->
  <rect x="50" y="50" width="6" height="220" rx="3" fill="url(#primary-glow)" filter="url(#glow)" />

  <!-- MAIN FOREGROUND TEXT & CONTENT (Guaranteed high visibility and layered on top) -->
  <!-- Category Tag -->
  <g transform="translate(76, 75)">
    <rect width="210" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="12" y="17" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">🛡️ CYBERSECURITY ECOSYSTEM</text>
  </g>

  <!-- Title Text -->
  <text x="76" y="142" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
    Awesome Security Event Monitoring
  </text>

  <!-- Subtitle Text -->
  <text x="76" y="182" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    Curated SaaS Platforms, Enterprise Cloud SIEM &amp; Self-Hosted Open-Source SOC Engines
  </text>

  <!-- Feature Micro Badges (Foreground Footer) -->
  <g transform="translate(76, 222)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="140" height="28" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
      <text x="12" y="18" fill="#E0F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">📊 Cloud SIEM</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(150, 0)">
      <rect width="165" height="28" rx="6" fill="#0F172A" stroke="#7C3AED" stroke-width="1" />
      <text x="12" y="18" fill="#F3E8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ Open-Source Stacks</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(325, 0)">
      <rect width="160" height="28" rx="6" fill="#0F172A" stroke="#059669" stroke-width="1" />
      <text x="12" y="18" fill="#D1FAE5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔍 Log Aggregation</text>
    </g>
  </g>
</svg>
